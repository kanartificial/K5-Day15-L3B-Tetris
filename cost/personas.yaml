# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:
  low: 100
  base: 500
  high: 1000
  source: "(tự ước tính) Quy mô triển khai FinPilot theo 3 giai đoạn: thử nghiệm MVP với 100 người dùng; mở rộng ban đầu 500 người; kịch bản tăng trưởng 1.000 người. Đây là quy mô vận hành giả định của sản phẩm, không phải số người dùng đã có hoặc số liệu thị trường."


personas:
  - name: dung_it
    share: 0.5
    uses_per_month: 4
    turns_per_session: 1
    source: "(tự ước tính) Giả định 50% người dùng chỉ mở FinPilot để rà soát ngân sách khoảng mỗi tuần một lần (4 phiên/tháng), mỗi phiên hỏi một vấn đề chính. Spec.md §2 đã chọn 4 lượt/tháng cho nhóm dùng ít; khảo sát n=21 không đo tần suất dùng ứng dụng."

  - name: dung_vua
    share: 0.3
    uses_per_month: 6
    turns_per_session: 2
    source: "(tự ước tính) Giả định 30% người dùng kiểm tra hàng tuần và hỏi thêm khi cần cân nhắc điều chỉnh chi tiêu (6 phiên/tháng), trung bình 2 lượt hỏi/phiên để làm rõ dữ liệu và xem gợi ý. Spec.md §2 chọn 6 lượt/tháng cho nhóm dùng vừa; khảo sát n=21 không đo tần suất dùng ứng dụng."

  - name: dung_nhieu
    share: 0.2
    uses_per_month: 8
    turns_per_session: 3
    source: "(tự ước tính) Giả định 20% người dùng thường xuyên theo dõi ngân sách khoảng hai lần/tuần (8 phiên/tháng), trung bình 3 lượt hỏi/phiên để kiểm tra dự báo, hỏi phương án cắt giảm và mô phỏng What-If. Spec.md §2 chọn 8 lượt/tháng cho nhóm dùng nhiều; khảo sát n=21 không đo tần suất dùng ứng dụng."

# Mỗi lượt mô phỏng lấy ngẫu nhiên câu type thuong/kho trong eval/benchmark.csv.
# Tần suất và số lượt hỏi là giả định hành vi sử dụng, không phải số liệu khảo sát.

prices:
  - model: gpt-6-luna
    input: 0.10
    output: 0.50
    cached_input: 0.01
    source: "https://developers.openai.com/api/docs/models · giá USD/1 triệu token: input $0.10, output $0.50, cached input $0.01 · Short context ≤ 272K token input · xem 28/11/2026."

  - model: gpt-6.2-sol
    input: 2.00
    output: 10.00
    source: "https://developers.openai.com/api/docs/models · giá USD/1 triệu token: input $2.00, output $10.00 · xem 28/11/2026. Dùng làm kịch bản model chất lượng/cost cao hơn để đối chiếu."
    
