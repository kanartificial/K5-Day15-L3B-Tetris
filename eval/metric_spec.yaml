# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: canh_bao_dung
    definition: "Một cảnh báo được tính là đúng khi hệ thống cảnh báo người dùng có nguy cơ vượt ngân sách và dữ liệu thực tế hoặc kết quả tính toán đối chiếu xác nhận chi tiêu dự kiến cuối tháng vượt ngân sách đã đặt. Tỷ lệ chính xác = số cảnh báo đúng / tổng số cảnh báo hệ thống đưa ra."
    grader: "code"
    threshold: "Precision ≥ 80% trên tập test có nhãn đối chiếu"
    why: "Người dùng muốn được cảnh báo sớm khi có nguy cơ thiếu hụt ngân sách, nhưng cảnh báo sai quá nhiều sẽ gây phiền và làm giảm niềm tin vào công cụ."

  - name: phat_hien_nguy_co
    definition: "Một trường hợp có nguy cơ vượt ngân sách được tính là phát hiện đúng nếu hệ thống đưa ra cảnh báo trước khi tổng chi tiêu thực tế vượt ngân sách. Tỷ lệ phát hiện = số trường hợp nguy cơ được cảnh báo đúng / tổng số trường hợp thực sự có nguy cơ vượt ngân sách trong tập test."
    grader: "code"
    threshold: "Recall ≥ 80% trên tập test có nhãn đối chiếu"
    why: "Người dùng thường chỉ nhận ra mình chi tiêu quá mức khi ngân sách gần cạn hoặc đã vượt. Phát hiện được phần lớn trường hợp nguy cơ giúp họ có thời gian điều chỉnh."

  - name: de_xuat_phu_hop
    definition: "Đề xuất được tính là phù hợp khi khoản chi tồn tại trong lịch sử giao dịch, có thể cân nhắc giảm, không thuộc chi phí thiết yếu người dùng cần bảo vệ, phù hợp với thói quen và mục tiêu ngân sách, đồng thời nêu rõ số tiền tiết kiệm dự kiến và lý do."
    grader: "nguoi"
    threshold: "≥ 80% đề xuất được đánh giá phù hợp"
    why: "Người dùng cần biết nên giảm khoản chi nào để tránh vượt ngân sách, nhưng vẫn đảm bảo các nhu cầu thiết yếu và thói quen chi tiêu cá nhân."